<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>攻击模拟页（本地测试用）</title>
<style>
body{background:#111;color:#ddd;font-family:"Microsoft YaHei",sans-serif;padding:20px}
iframe{width:100%;height:420px;border:2px dashed #c33;background:#000}
.note{color:#e88;font-size:13px}
</style>
</head>
<body>
<h1>⚠️ 攻击模拟页（本地测试用）</h1>
<p class="note">本页模拟"恶意站点把目标页面 iframe 嵌套"的场景。若目标页启用了反嵌套防护，
它应当跳出本 iframe 并占据顶层窗口（页面整体变成目标页）。</p>
<iframe id="victim" src="./protected-sample.html" referrerpolicy="no-referrer"></iframe>
<p class="note">iframe 内应显示防护样板页；如果 2 秒内它"逃逸"到了顶层（整页刷新为样板页），说明防护生效。</p>
</body>
</html>
